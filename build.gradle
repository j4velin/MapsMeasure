plugins {
    id 'com.android.application' version '9.4.1'
}

android {
    namespace = 'de.j4velin.mapsmeasure'
    compileSdk = 37

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    defaultConfig {
        applicationId = "de.j4velin.mapsmeasure"
        minSdk = 23
        targetSdk = 37
        if (!project.file("key.properties").exists()) {
            resValue "string", "maps_api_key", "0000"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        release
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
        debug {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            debuggable = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
}

def props = new Properties()

if (project.file("key.properties").exists()) {
    project.file("key.properties").withInputStream { props.load(it) }
} else {
    logger.warn('Using sample keystore!!')
    project.file("key.properties.sample").withInputStream { props.load(it) }
}

android.signingConfigs.release.storeFile = project.file(props.keyStore)
android.signingConfigs.release.storePassword = props.keyStorePassword
android.signingConfigs.release.keyAlias = props.keyAlias
android.signingConfigs.release.keyPassword = props.keyAliasPassword
